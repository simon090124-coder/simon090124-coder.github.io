<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英文单词复习卡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background-color: #f0f4f8;
            padding: 24px 16px;
        }
        .wrap {
            max-width: 620px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #2d3748;
            margin-bottom: 12px;
            font-size: 24px;
        }
        .progress {
            text-align:center;
            margin-bottom:20px;
            color:#4a5568;
        }
        .flashcard {
            perspective: 1000px;
            cursor: pointer;
            height: 200px;
            margin-bottom:24px;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .flashcard.flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius:16px;
            padding:24px;
            font-size:22px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.12);
        }
        .card-front {
            background: #2b6cb0;
            color: white;
        }
        .card-back {
            background: #ffffff;
            color: #2d3748;
            transform: rotateY(180deg);
            border:1px solid #e2e8f0;
        }
        .btn-group {
            display:none;
            gap:16px;
            justify-content:center;
            margin-top:12px;
        }
        .btn-group.show {
            display:flex;
        }
        button {
            padding:12px 28px;
            border:none;
            border-radius:10px;
            font-size:18px;
            cursor:pointer;
        }
        .btn-know {
            background:#38a169;
            color:white;
        }
        .btn-dont {
            background:#e53e3e;
            color:white;
        }
        .end-panel {
            display:none;
            text-align:center;
            margin-top:30px;
        }
        .end-panel.show {
            display:block;
        }
        .end-panel p {
            font-size:20px;
            margin-bottom:20px;
        }
        .btn-restart-all {
            background:#4a5568;
            color:white;
        }
        .btn-review-wrong {
            background:#3182ce;
            color:white;
        }
    </style>
</head>
<body>
<div class="wrap">
    <h1>📖 英文单词卡自测</h1>
    <div class="progress" id="progress"></div>

    <div class="flashcard" id="card">
        <div class="card-inner">
            <div class="card-front" id="front">word</div>
            <div class="card-back" id="back">释义</div>
        </div>
    </div>

    <div class="btn-group" id="btnGroup">
        <button class="btn-know" id="btnKnow">✅ 会</button>
        <button class="btn-dont" id="btnDont">❌ 不会</button>
    </div>

    <div class="end-panel" id="endPanel">
        <p id="endText"></p>
        <button class="btn-review-wrong" id="btnReviewWrong">复习不会的单词</button>
        <button class="btn-restart-all" id="btnRestartAll">全部重新开始</button>
    </div>
</div>

<script>

    {en:"do cleaning / go shopping",zh:"搞清洁 / 去购物"},
    {en:"be defined as",zh:"被定义"},
    {en:"have (sth / nothing) to do with",zh:"与…有关 / 无关"},

    {en:"mimic",zh:"v. 模仿"},
    {en:"diversity",zh:"n. 多样性"},
    {en:"transparent",zh:"adj. 透明的；显而易见的"},
    {en:"futuristic",zh:"adj. 未来派的"},
    {en:"revolutionize",zh:"v. 彻底变革"},
    {en:"navigate",zh:"v. 导航；驾驭"},
    {en:"ethic",zh:"n. 道德准则，伦理"},
    {en:"distract",zh:"v. 使分心，转移注意力"},
    {en:"approximately",zh:"adv. 大约，近似地"},
    {en:"eliminate",zh:"v. 消除，排除"},
    {en:"optimize",zh:"v. 优化"},
    {en:"congestion",zh:"n. 拥堵，堵塞"},
    {en:"emission",zh:"n. 排放物，散发"},
    {en:"accessibility",zh:"n. 可及性，易用性"},
    {en:"dominate",zh:"v. 支配，占主导地位"},
    {en:"dilemma",zh:"n. 两难困境"},
    {en:"prioritize",zh:"v. 优先处理"},
    {en:"transition",zh:"n. 过渡，转变"},
    {en:"hurdle",zh:"n. 障碍，难关"},
];

let wordList = [...allWords];
let wrongList = [];
let currentIdx = 0;
let isFlipped = false;

const card = document.getElementById('card');
const front = document.getElementById('front');
const back = document.getElementById('back');
const btnGroup = document.getElementById('btnGroup');
const endPanel = document.getElementById('endPanel');
const progressText = document.getElementById('progress');
const endText = document.getElementById('endText');

function shuffle(arr){
    const tmp = [...arr];
    for(let i=tmp.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [tmp[i],tmp[j]] = [tmp[j],tmp[i]];
    }
    return tmp;
}

function renderWord(){
    endPanel.classList.remove('show');
    btnGroup.classList.remove('show');
    isFlipped = false;
    card.classList.remove('flipped');
    if(currentIdx >= wordList.length){
        showEnd();
        return;
    }
    const w = wordList[currentIdx];
    front.innerText = w.en;
    back.innerText = w.zh;
    progressText.innerText = `${currentIdx+1} / ${wordList.length}`;
}

function showEnd(){
    card.style.display = 'none';
    btnGroup.classList.remove('show');
    endPanel.classList.add('show');
    endText.innerText = `✅ 本轮完成！一共标记【不会】：${wrongList.length} 个单词`;
}

card.onclick = function(){
    if(isFlipped) return;
    isFlipped = true;
    card.classList.add('flipped');
    btnGroup.classList.add('show');
};

document.getElementById('btnKnow').onclick = function(){
    currentIdx++;
    renderWord();
}
document.getElementById('btnDont').onclick = function(){
    wrongList.push(wordList[currentIdx]);
    currentIdx++;
    renderWord();
}
document.getElementById('btnReviewWrong').onclick = function(){
    wordList = shuffle([...wrongList]);
    wrongList = [];
    currentIdx = 0;
    card.style.display = 'block';
    renderWord();
}
document.getElementById('btnRestartAll').onclick = function(){
    wordList = shuffle([...allWords]);
    wrongList = [];
    currentIdx = 0;
    card.style.display = 'block';
    renderWord();
}

wordList = shuffle(wordList);
renderWord();
</script>
</body>
</html>
